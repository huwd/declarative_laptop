# Advisory prose checks, run locally with `just docs-prose` (not in CI).
# StylesPath comes from the Nix wrapper (packages/vale.nix).
MinAlertLevel = suggestion
Vocab = House

[*.md]
BasedOnStyles = Vale, House, write-good, proselint

# Superseded by House.Spelling (en_GB)
Vale.Spelling = NO
# Flags every "is"/"are" — noise, not advice
write-good.E-Prime = NO
# US-centric; flags British forms as "inconsistent"
proselint.Spelling = NO
