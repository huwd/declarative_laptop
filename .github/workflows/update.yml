name: Update

on:
  schedule:
    - cron: "0 9 * * 1"   # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  # Everything that runs Nix (and therefore third-party binaries) happens
  # here with a read-only token. Only the open-pr job below can write, and
  # it never installs Nix or runs anything from the updated inputs.
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # main
        with:
          use-flakehub: false

      - name: Update flake inputs
        run: nix flake update

      - name: Check if flake.lock changed
        id: changed
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated closure
        id: build
        if: steps.changed.outputs.changed == 'true'
        run: |
          CLOSURE=$(nix build \
            .#nixosConfigurations.framework-13.config.system.build.toplevel \
            --no-link --print-out-paths)
          echo "closure=$CLOSURE" >> "$GITHUB_OUTPUT"

      - name: Restore previous closure for diff
        id: cache
        if: steps.changed.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .main-closure
          key: main-closure-framework-13

      - name: Generate nvd diff
        if: steps.changed.outputs.changed == 'true' && steps.cache.outputs.cache-hit == 'true'
        run: |
          PREV=$(cat .main-closure)
          CURR=${{ steps.build.outputs.closure }}
          nix run --inputs-from . nixpkgs#nvd -- diff "$PREV" "$CURR" > nvd-diff.txt 2>&1 || true

      - name: Run vulnix scan
        if: steps.changed.outputs.changed == 'true'
        run: |
          # See build.yml for why --mirror is needed (NVD retired the feeds vulnix expects)
          nix run --inputs-from . nixpkgs#vulnix -- --mirror https://vig-os.github.io/nvd-mirror/ --closure ${{ steps.build.outputs.closure }} --whitelist vulnix.toml \
            > vulnix-report.txt 2>&1 || true

      - name: Build PR body
        if: steps.changed.outputs.changed == 'true'
        run: |
          {
            echo "Automated weekly \`nix flake update\`."
            echo ""
            echo "## 📦 Package changes"
            echo '```'
            cat nvd-diff.txt 2>/dev/null || echo "No previous build cached — diff unavailable."
            echo '```'
            echo ""
            echo "## 🔒 CVE findings (vulnix)"
            echo '```'
            cat vulnix-report.txt 2>/dev/null || echo "No findings."
            echo '```'
            echo ""
            echo "> New CVE findings block merge until triaged. Add accepted risks to \`vulnix.toml\`."
          } > .pr-body.md

      - name: Upload updated lock file and PR body
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flake-update
          path: |
            flake.lock
            .pr-body.md
          include-hidden-files: true
          retention-days: 1

  open-pr:
    name: Open update PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: flake-update
          path: ${{ runner.temp }}/flake-update

      - name: Apply updated lock file
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/flake-update
        run: cp "$ARTIFACT_DIR/flake.lock" flake.lock

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true # main requires signed commits (ruleset)
          branch: chore/nixpkgs-update
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore: update nixpkgs"
          title: "chore: weekly nixpkgs update"
          body-path: ${{ runner.temp }}/flake-update/.pr-body.md
