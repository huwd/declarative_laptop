# ── Real, unpatched, accepted as low risk — re-check before `until` ─────────
# No fixed release in nixpkgs yet. Each needs crafted local input or a
# same-link attacker against a service that isn't running.

["avahi-0.8"]
cve = "CVE-2025-59529"
until = "2026-12-20"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "avahi-daemon runs (GNOME service discovery). The simple-protocol server ignores its client limit, allowing a local user to exhaust connections: local DoS only, single-user machine. Re-checked on 2026-11-22: the v0.8 source defines CLIENTS_MAX in avahi-daemon/simple-protocol.c but never checks it, so 0.8 is affected. The nixpkgs package carries a note that this CVE 'is introduced by 4e2e1ea', but that commit only touches avahi-core/wide-area.c, so the note does not make 0.8 a false positive. NVD lists no fixed release (affected through 0.9-rc5), and nixpkgs ships 0.8 with no patch for it. Renewed for four weeks given the low impact.",
  "Mitigation: do not give untrusted users a local account or run untrusted code on this machine; if mDNS (.local) lookups stop working, restart avahi-daemon.",
]

["cjson-1.7.19"]
cve = [ "CVE-2026-67215", "CVE-2026-67216", "CVE-2026-67217" ]
until = "2026-12-20"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "All in cJSON_Utils (RFC 6902 JSON Patch / cJSON_Compare): stack exhaustion, exponential compare time, non-atomic patch. Needs an application applying an untrusted JSON Patch: DoS at worst. Re-checked on 2026-11-22: nixpkgs still ships 1.7.19 with no patches. Renewed for four weeks given the low impact.",
  "Mitigation: do not feed JSON Patch documents or JSON for comparison from untrusted sources to tools built on cJSON.",
]

["cfitsio-4.7.0"]
cve = [ "CVE-2026-111124", "CVE-2026-111125" ]
until = "2026-12-20"
comment = [
  "Real and unpatched: heap out-of-bounds reads on a crafted FITS (astronomy image) file, one through a zero or negative ZDITHER0 seed in the imcompress.c unquantize helpers and one in the HCOMPRESS tile decoder (fits_hdecompress.c). A crash or a small heap leak at worst (CVSS 6.1, local, needs a user to open the file). NVD lists 4.7.0, the latest release, as affected. Upstream master has HCOMPRESS bounds checking (commit b07f2e4c, 2026-11-02), which looks like the fix for CVE-2026-111125, but there is no release yet; nixpkgs ships 4.7.0 with a patch only for CVE-2026-115504. cfitsio joined the closure on 2026-11-22 with appstream 1.2.3, through vips: the only file in appstream that references vips is lib/ascompose/asc-mediaworker, the helper `appstreamcli compose` uses to process icons and screenshots when building catalogue metadata for a software repository. libappstream, which GNOME apps use to read metadata, does not link vips, and nothing here runs `appstreamcli compose`. Accepted as low risk. Re-check for a cfitsio release after 4.7.0 before this expires.",
  "Mitigation: do not run `appstreamcli compose` or the vips command-line tools on FITS files or software metadata from untrusted sources.",
]

["dhcpcd-10.3.2"]
cve = [ "CVE-2026-56113", "CVE-2026-56114", "CVE-2026-56116", "CVE-2026-56117" ]
until = "2026-12-20"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "Fixes land after 10.3.2. dhcpcd is in the closure only as a NetworkManager dependency; the dhcpcd service is inactive and NetworkManager uses its internal DHCP client, so neither the same-link DHCPv6/RA bugs nor the control-socket bug are reachable. Re-checked on 2026-11-22: nixpkgs still ships 10.3.2 with no patches. Renewed for four weeks because the code isn't reachable.",
  "Mitigation: do not enable networking.dhcpcd or switch NetworkManager's DHCP client to dhcpcd until a fixed release lands.",
]

["libsndfile-1.2.2"]
cve = [ "CVE-2024-50612", "CVE-2024-50613", "CVE-2025-52194", "CVE-2025-56226", "CVE-2026-37555" ]
until = "2026-12-06"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "No release since 1.2.2. Re-checked on 2026-11-22: nixpkgs (from commit 91d5f8b, in our lock) now patches two of the five. CVE-2024-50612 (vorbis_analysis_wrote out-of-bounds read, upstream PR 1045) and CVE-2026-37555 (IMA ADPCM integer overflow on the WAV and close paths, upstream PR 1123) carry named CVE patches in libsndfile.patches, so those two are N/A here. vulnix can't see that because the version string is unchanged. CVE-2024-50613, CVE-2025-52194 and CVE-2025-56226 are still unpatched. All need a crafted audio file opened by an app using libsndfile; CVE-2025-52194 (IRCAM header overflow, CVSS 7.5) is the most serious. Accepted as low risk; renewed for two weeks given that CVSS. Drop the unpatched three when a fixed libsndfile lands.",
  "Mitigation: do not open untrusted IRCAM, WAV or AIFF files in apps that use libsndfile; stick to audio from sources you trust.",
]
