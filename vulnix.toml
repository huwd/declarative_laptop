# ── Already fixed in the version we run ─────────────────────────────────────

["avahi"]
cve = "CVE-2021-26720"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "Only affects Debian's packaging (avahi-daemon-check-dns.sh run from /etc/network/if-up.d); NixOS doesn't ship that script."

["brotli-1.2.0"]
cve = "CVE-2026-111497"
until = "2026-11-06"
comment = [
  "Real and unpatched: a buffer overflow in the Brotli decoder (c/dec/decode.c) on a crafted stream, in 1.0.3 through 1.2.0, fixed in 1.2.1 (published 22 Oct 2026, CVSS 9.8). nixpkgs still ships 1.2.0 on nixos-unstable, and its one patch is an unrelated platform macro. The library is linked by curl (which only decodes brotli with --compressed or an Accept-Encoding it sends), freetype (WOFF2 fonts), libsoup, nodejs-slim, mupdf and nix-util. Exploitation needs a hostile server, font or document to feed one of them a crafted stream. Accepted as low-to-medium risk for a short period because the severity is high and a fix exists. Re-check for brotli 1.2.1 in nixpkgs before this expires.",
  "Mitigation: until a fixed brotli lands, do not run curl --compressed against untrusted servers, do not open untrusted web content in GNOME embedded web views, and do not open untrusted PDFs or fonts.",
]

["glib-2.88.3"]
cve = "CVE-2026-58016"
until = "2026-11-13"
comment = [
  "Real and unpatched: g_dbus_node_info_new_for_xml() mishandles a node element nested inside method, signal, property or arg in malformed D-Bus introspection XML, causing an unsigned integer overflow and an out-of-bounds read (denial of service only, CVSS 7.5). NVD gives the fix as glib 2.89.0, a development release; whether it is backported to 2.88 is unverified. nixpkgs ships 2.88.3 on nixos-unstable with no related patch. Exploitation needs an application of ours to parse attacker-supplied introspection XML, which a remote party cannot normally supply. Accepted as low risk. Re-check for a fixed glib in nixpkgs before this expires.",
  "Mitigation: until a fixed glib lands, do not run D-Bus tools or applications against untrusted introspection XML.",
]

["cups-2.4.19"]
cve = [ "CVE-2022-26691", "CVE-2026-55480", "CVE-2026-61702", "CVE-2026-107888", "CVE-2026-55453", "CVE-2026-107885", "CVE-2026-107890", "CVE-2026-55467", "CVE-2026-107886" ]
until = "2026-11-13"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "CVE-2022-26691 is fixed in CUPS 2.4.2 (Apple's advisory for the same bug); we run 2.4.19. The other eight are real but are all in the cupsd scheduler or the IPP backend (CVE-2026-55480 symlink race, 61702 path traversal, 55453 and 55467 option injection, 107888, 107885, 107890 and 107886 denial of service); they are fixed in CUPS 2.4.20 (CVE-2026-107885 needs 2.4.21), but nixpkgs still ships 2.4.19. services.printing is disabled, so cupsd never runs; only the libcups client library stays in the closure, pulled in by GTK, Qt and similar. None of these bugs are in libcups. Accepted as low risk. Re-check for a CUPS 2.4.21 bump in nixpkgs before this expires.",
  "Mitigation: do not re-enable services.printing until a fixed CUPS lands, and do not run cupsd or open IPP (port 631) in the meantime.",
]

[dbus-1]
cve = [ "CVE-2022-42010", "CVE-2022-42011", "CVE-2022-42012" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "vulnix parses the 'dbus-1' config derivation as dbus version 1. Real dbus is 1.16.2; these were fixed in 1.14.4."

["lapack-3"]
cve = "CVE-2021-4048"
issue_url = "https://github.com/huwd/declarative_laptop/issues/39"
comment = "vulnix sees nixpkgs' lapack interface package, whose version string ('3') is the LAPACK API version, not the real implementation. passthru.implementation confirms this resolves to openblas 0.3.33 — the fix landed in OpenBLAS 0.3.18 and upstream LAPACK 3.10.1."

["ffmpeg-9.0.1"]
cve = [ "CVE-2025-25468", "CVE-2025-25469", "CVE-2026-107660", "CVE-2026-107675", "CVE-2026-107676", "CVE-2026-107677", "CVE-2026-107678", "CVE-2026-107696" ]
until = "2026-11-06"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "CVE-2025-25468/25469 are memory leaks fixed on FFmpeg master (commit d5873b) in early 2025; the 9.0.1 release includes the fix, permanently N/A. CVE-2026-107660 (TLS hostname check skipped for IP-literal URLs, mbedtls backend) is fixed in 9.0.2, not yet in nixpkgs. CVE-2026-107675/107676/107677/107678/107696 (SFTP host-key check, uninitialised metadata bytes, DASH and RTSP infinite loops, stack exhaustion on a crafted MP4) affect releases through 9.0.2 with no upstream fix yet. All real and accepted as low risk: each needs ffmpeg to process hostile media or connect to a hostile server, and ffmpeg is only in the closure as a library dependency of desktop apps; no scripts or services here feed it untrusted URLs. Re-check for an ffmpeg bump in nixpkgs before this expires.",
  "Mitigation: until nixpkgs ships a fixed ffmpeg, do not play, transcode or thumbnail media from untrusted sources with ffmpeg or apps built on it (especially RTSP, DASH or sftp URLs, and MP4 or MKV files from unknown senders). Stick to media you trust.",
]

