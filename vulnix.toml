# Accepted-risk / false-positive whitelist for the vulnix CVE scan.
#
# Format: https://github.com/nix-community/vulnix/blob/master/doc/vulnix-whitelist.5.md
# Fields per entry: cve, until (YYYY-MM-DD — rule expires and findings
# reappear), comment, issue_url.
#
# Every entry carries a specific justification. Permanent entries (no
# `until`) are false positives or already fixed; entries with `until` are
# real, unpatched and accepted as low risk — re-check them before expiry.
# Keys with a version (pkg-1.2.3) stop matching when the package is bumped,
# which forces a fresh look; version-less keys are for wrong-product matches.
#
# Real, unpatched entries (those with `until`) also say how to stay safe while
# they are unpatched. `comment` is a list: the first item is the triage, the
# second starts "Mitigation:" and names what NOT to do with this machine, or
# what to do instead, until the fix lands. vulnix prints each item as a bullet
# in the CI comment. Do not add a separate `mitigation` key: vulnix ignores
# unknown keys and warns about them on every run.

# ── Individually triaged ─────────────────────────────────────────────────────

["perl-5.42.3-env"]
cve = [ "CVE-2026-8376", "CVE-2026-57432", "CVE-2026-13221" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "All three are permanently N/A. CVE-2026-8376 only affects 32-bit builds (heap overflow in regex compilation); this system is x86_64-linux. CVE-2026-57432's vulnerable range ends before 5.42.3-RC1; we run 5.42.3 final, which already contains the fix. CVE-2026-13221 (regex trie offset overflow with >65535 alternation branches) is fixed upstream in 5.43.10 by commit 03f74bb and backported to 5.42.3: regcomp_study.c in the nixpkgs 5.42.3 source has the `tail - startbranch >= U16_MAX` guard (GH #23388). The CPAN Security Group advisory gives the affected range as \"through 5.43.9\", so the flag on 5.42.3 is a false positive."

["perl-5.42.3"]
cve = [ "CVE-2026-8376", "CVE-2026-57432", "CVE-2026-13221" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "Same as perl-5.42.3-env — see that entry."

["binutils-2.46"]
cve = [ "CVE-2026-6846", "CVE-2025-69649", "CVE-2025-69650", "CVE-2025-69651", "CVE-2025-69652" ]
until = "2026-11-26"
comment = "Pulled in via gcc, which LazyVim's nvim-treesitter uses to compile parsers from source fetched by lazy.nvim. CVE-2026-6846 needs linking a crafted XCOFF (AIX) object file; nothing here links XCOFF. It is confirmed unfixed in 2.46 (bfd/xcofflink.c still sizes reloc_info by section_count + 1) and fixed in 2.47. CVE-2025-69649/69650/69651/69652 are readelf crashes (DoS only) on crafted ELF input; readelf is never run on untrusted binaries. Debian's tracker lists fix commits for these tagged binutils-2_46, but each description says affected 'thru 2.46', so whether the nixpkgs 2.46 tarball already contains them is unverified. Accepted risk; drop this entry once nixpkgs ships binutils 2.47, and re-check before it expires."

["samba-4.23.10"]
cve = "CVE-2026-2340"
comment = "Only present via gvfs (SMB client for Nautilus 'Other Locations'). The bug is in the server-side vfs_worm VFS module; we never run smbd/nmbd."

["snappy-1.2.2"]
cve = [ "CVE-2023-28115", "CVE-2023-41330" ]
comment = "NVD CPE false positive: these CVEs are in the unrelated PHP knplabs/knp-snappy PDF library, not Google's Snappy compression library."

["zlib-1.3.2"]
cve = [ "CVE-2026-27820", "CVE-2023-6992" ]
comment = "NVD CPE false positives. CVE-2026-27820 is in the Ruby zlib gem (Zlib::GzipReader#ungetc), a separate codebase from the C zlib library nixpkgs ships. CVE-2023-6992 only affects Cloudflare's zlib fork; upstream zlib (what nixpkgs ships) was confirmed unaffected by the reporter."

["unzip-6.0"]
cve = [ "CVE-2021-4217", "CVE-2022-0529", "CVE-2022-0530" ]
comment = "Already patched in nixpkgs: unzip.patches includes CVE-2021-4217.patch and 28-cve-2022-0529-and-cve-2022-0530.patch. Upstream Info-ZIP never released a fixed version (last release ~2009), so the version string still reads 6.0 and vulnix's version-based matching can't see the applied patches."

