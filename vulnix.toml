["thrift-0.22.0"]
cve = [ "CVE-2021-24028", "CVE-2025-48431", "CVE-2026-41602", "CVE-2026-41604", "CVE-2026-41605", "CVE-2026-41606", "CVE-2026-41607", "CVE-2026-41608", "CVE-2026-41636", "CVE-2026-43868", "CVE-2026-43869", "CVE-2026-43870", "CVE-2026-43871", "CVE-2026-45112", "CVE-2026-48144", "CVE-2026-48145", "CVE-2026-48586", "CVE-2026-49158", "CVE-2026-55968", "CVE-2026-55969", "CVE-2026-55970", "CVE-2026-55971", "CVE-2026-58023", "CVE-2026-58389", "CVE-2026-58662", "CVE-2026-66053" ]
until = "2026-10-23"
issue_url = "https://github.com/huwd/declarative_laptop/issues/39"
comment = "CVE-2021-24028 is Facebook Thrift (Meta's fbthrift, date-versioned YYYY.MM.DD.NN) — an unrelated codebase from Apache Thrift 0.x, permanently N/A. The remaining 25 are real Apache Thrift bugs, unpatched until 0.23.0/0.24.0 (nixpkgs ships 0.22.0), each scoped to a specific language binding or network transport: TSSLSocket/TSSLTransportFactory cert validation, THeaderTransport decompression/header parsing, TCompactProtocol varint handling (Python/Go/PHP/Java), Go TFramedTransport, the C++ JSON parser, c_glib dispatch, Node.js web_server.js, Java/Rust resource allocation. Thrift here is pulled in transitively via arrow-cpp (pyarrow -> chromadb, Open WebUI's RAG vector store), which only uses TCompactProtocol over an in-memory buffer to encode/decode local Parquet footer metadata — no SSL socket, HTTP transport, JSON parser, non-C++ binding, or Thrift RPC server (Arrow Flight uses gRPC) is ever instantiated. Re-check when nixpkgs bumps past 0.22.0."

