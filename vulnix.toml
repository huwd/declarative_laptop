["openssl-3.5.8"]
cve = [ "CVE-2026-84782", "CVE-2026-54873", "CVE-2026-72897", "CVE-2026-84784", "CVE-2026-35189", "CVE-2026-42772", "CVE-2026-75804", "CVE-2026-75805", "CVE-2026-75806", "CVE-2026-35191", "CVE-2026-54872", "CVE-2026-54875", "CVE-2026-77696" ]
until = "2026-11-02"
issue_url = "https://github.com/huwd/declarative_laptop/pull/69"
comment = "All thirteen fixed in OpenSSL 3.5.9; nixpkgs (including unstable) still ships 3.5.8. Each needs OpenSSL acting as a server or a specific protocol this laptop doesn't serve: CVE-2026-84782 (DTLS retransmission over-read), CVE-2026-75806 (DTLS 1.2 teardown), CVE-2026-54873/84784/42772/75804/35191 (QUIC stack: memory retention, connection-ID flood, reassembly, flow control, amplification) and CVE-2026-72897 (servers calling SSL_set_SSL_CTX) have no DTLS/QUIC/TLS server running here. CVE-2026-75805 is a CMP client NULL deref (CMP is not used). CVE-2026-35189 is heap growth from a certificate with many CRL distribution points: DoS only. CVE-2026-54872/54875/77696 are timing side-channels in SM2 and generic-curve ECDSA signing (54875 is ARM64/RISC-V only; both hosts are x86_64) and need an attacker timing many local signatures. Short expiry given the 8.2 CVSS; re-check for an openssl 3.5.9 bump."

["openssh-10.5p1"]
cve = [ "CVE-2026-106587", "CVE-2026-106552", "CVE-2026-106553", "CVE-2026-106555", "CVE-2026-106582", "CVE-2026-106583", "CVE-2026-106584", "CVE-2026-106585", "CVE-2026-106586" ]
until = "2026-11-02"
issue_url = "https://github.com/huwd/declarative_laptop/pull/69"
comment = [
  "All fixed in OpenSSH 10.6, not yet in nixpkgs. sshd is disabled (services.openssh.enable = false in modules/security.nix), so the sshd-only bugs are N/A: CVE-2026-106587 (\"none\" config value read as a filename), CVE-2026-106586 (restrict keyword and tunnel forwarding) and CVE-2026-106553/106555 (GSSAPI state persisting across attempts). The package stays in the closure for the ssh client, ssh-keygen and git, so the client-side bugs are real but low risk: CVE-2026-106585 (no packet-size check on decompression) and CVE-2026-106552 (sftp path traversal during recursive copy) need a hostile server, and we only connect to GitHub and hosts we control; CVE-2026-106583 (username injection) needs a crafted username on our own command line; CVE-2026-106582 (compression weakness) and CVE-2026-106584 (ssh-keygen certificate expiry across DST) have negligible impact here. Re-check for an openssh 10.6 bump.",
  "Mitigation: until openssh 10.6 lands, only use ssh, scp and sftp against GitHub and hosts you control; avoid recursive scp or sftp downloads from servers you do not trust; never pass an untrusted username on the command line; keep sshd disabled.",
]

["libsoup-3.6.6"]
cve = [ "CVE-2026-102555", "CVE-2026-102556", "CVE-2026-102557", "CVE-2026-102558", "CVE-2026-102559", "CVE-2026-102560" ]
until = "2026-11-13"
comment = [
  "Real and unpatched: fixed in libsoup 3.7.3 and later (3.8.0 is the current stable release), but nixpkgs still ships 3.6.6, the last 3.6 release, which predates the 29 Sep disclosure. CVE-2026-102556/102557/102558 are heap corruption or crashes in SoupWebsocketConnection (wrong Pong signal type, no cap on reassembled message size, frame-length overflow when max-incoming-payload-size is unlimited); CVE-2026-102555 is an out-of-bounds read decoding a crafted base64 data: URI with embedded NULs. CVE-2026-102559 and CVE-2026-102560 are heap overflows on the sending side (size truncation when masking or permessage-deflate compressing a very large outgoing WebSocket message), so they need an app of ours to send a huge message. libsoup is only a dependency of GNOME components (webkitgtk, gvfs, geoclue, gnome-online-accounts, evolution-data-server, sushi); exploitation needs a hostile WebSocket peer or a crafted data: URI to reach one of them, and our main browser is separate. Accepted as low risk. Re-check for a libsoup 3.8 bump in nixpkgs before this expires.",
  "Mitigation: until a fixed libsoup lands, do not open untrusted links or web content inside GNOME embedded web views (Online Accounts sign-in, Evolution, sushi previews of untrusted files), do untrusted browsing in the main browser instead, and do not mount untrusted network shares in Files.",
]

["unbound-1.26.0"]
cve = [ "CVE-2026-81642", "CVE-2026-82717", "CVE-2026-81634", "CVE-2026-82720", "CVE-2026-80225", "CVE-2026-85501" ]
until = "2026-10-07"
issue_url = "https://github.com/huwd/declarative_laptop/issues/45"
comment = "Same disclosure batch as CVE-2026-81642 (all fixed in unbound 1.26.1, not yet in nixpkgs). Only present as unbound-lib, pulled in transitively via networkmanager -> gnutls for optional DANE (DNS-based TLS cert auth) support — no unbound daemon runs. CVE-2026-81634 and CVE-2026-85501 require DNSSEC validation, same DANE-path exposure as CVE-2026-81642. CVE-2026-82717 (CNAME synthesis), CVE-2026-80225 (TCP/DoT connection abuse), and CVE-2026-82720 (DoH stream cleanup) require full iterative-resolver or DoH-server operation, which the DANE-only library usage never performs. Short expiry given severity; re-check nixpkgs for a 1.26.1 bump."
