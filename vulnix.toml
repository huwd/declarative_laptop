["thrift-0.24.0"]
cve = "CVE-2021-24028"
issue_url = "https://github.com/huwd/declarative_laptop/pull/60"
comment = "Facebook Thrift (Meta's fbthrift, date-versioned YYYY.MM.DD.NN) SSL cert validation bug — unrelated codebase from Apache Thrift 0.x, same false positive already identified under thrift-0.22.0. framework-13 resolves thrift to 0.24.0 (dell-xps-13-9343 still resolves 0.22.0); the other 25 CVEs whitelisted under thrift-0.22.0 no longer apply here — 0.24.0 already contains those fixes, so vulnix doesn't flag them."

["thrift-0.25.0"]
cve = "CVE-2021-24028"
comment = "NVD CPE false positive, the same one recorded under thrift-0.24.0: CVE-2021-24028 is Facebook Thrift (Meta's fbthrift, date-versioned YYYY.MM.DD.NN), affected before 2021.02.22.00, an unrelated codebase from Apache Thrift 0.x. vulnix reads 0.25.0 as lower than a 2021 date. On framework-13 it is reached only through open-webui, python3.14-pyarrow and arrow-cpp."

["ninja-1.13.2"]
cve = "CVE-2021-4336"
comment = "NVD CPE false positive: CVE-2021-4336 is an SQL injection in ITRS Group's monitor-ninja, a PHP monitoring web app, affected before 2021.11.30. It is unrelated to the Ninja build system. vulnix reads 1.13.2 as lower than that date. On framework-13 it is reached only through open-webui and python3.14-torch."

["game-music-emu"]
cve = [ "CVE-2026-0016", "CVE-2026-0017", "CVE-2026-0018" ]
comment = "NVD lists libgme:game_music_emu alongside Android, but all three descriptions are bugs in AOSP Java services (BiometricService, AccessibilityManagerService, CredentialManagerService). game-music-emu is a C++ chip-music library with none of that code, and it is only in the closure through gst-plugins-bad for the thumbnailer. Treated as NVD data errors from an Android security bulletin."


# ── Already fixed in the version we run ─────────────────────────────────────

["avahi"]
cve = "CVE-2021-26720"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "Only affects Debian's packaging (avahi-daemon-check-dns.sh run from /etc/network/if-up.d); NixOS doesn't ship that script."

["brotli-1.2.1"]
cve = "CVE-2026-111497"
comment = "NVD CPE false positive: 1.2.1 is the release that fixes this CVE. The record lists Google Brotli as affected from 1.0.3 up to 1.0.10, from 1.1.0 up to 1.1.1 and from 1.2.0 up to 1.2.1, so 1.2.1 is outside every range. It also lists an unrelated Go port, andybalholm/brotli, affected below 1.2.7. vulnix reports 1.2.1 anyway, and the Go port's range is the likely match, because it compares the product name and version and not the vendor. In CISA KEV since 2026-10-27; its notes name the v1.2.1 release as the fix, which agrees with this assessment."

["cups-2.4.19"]
cve = [ "CVE-2022-26691", "CVE-2026-55480", "CVE-2026-61702", "CVE-2026-107888", "CVE-2026-55453", "CVE-2026-107885", "CVE-2026-107890", "CVE-2026-55467", "CVE-2026-107886" ]
until = "2026-11-27"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "CVE-2022-26691 is fixed in CUPS 2.4.2 (Apple's advisory for the same bug); we run 2.4.19. The other eight are real but are all in the cupsd scheduler or the IPP backend (CVE-2026-55480 symlink race, 61702 path traversal, 55453 and 55467 option injection, 107888, 107885, 107890 and 107886 denial of service); they are fixed in CUPS 2.4.20 (CVE-2026-107885 needs 2.4.21), but nixpkgs still ships 2.4.19. services.printing is disabled, so cupsd never runs; only the libcups client library stays in the closure, pulled in by GTK, Qt and similar. None of these bugs are in libcups. Accepted as low risk. Re-check for a CUPS 2.4.21 bump in nixpkgs before this expires.",
  "Mitigation: do not re-enable services.printing until a fixed CUPS lands, and do not run cupsd or open IPP (port 631) in the meantime.",
]

[dbus-1]
cve = [ "CVE-2022-42010", "CVE-2022-42011", "CVE-2022-42012" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "vulnix parses the 'dbus-1' config derivation as dbus version 1. Real dbus is 1.16.2; these were fixed in 1.14.4."

["lapack-3"]
cve = "CVE-2021-4048"
issue_url = "https://github.com/huwd/declarative_laptop/issues/39"
comment = "vulnix sees nixpkgs' lapack interface package, whose version string ('3') is the LAPACK API version, not the real implementation. passthru.implementation confirms this resolves to openblas 0.3.33 — the fix landed in OpenBLAS 0.3.18 and upstream LAPACK 3.10.1."

["ffmpeg-9.0.2"]
cve = [ "CVE-2025-25468", "CVE-2025-25469", "CVE-2026-107675", "CVE-2026-107676", "CVE-2026-107677", "CVE-2026-107678", "CVE-2026-107696", "CVE-2026-125064" ]
until = "2026-12-06"
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = [
  "CVE-2025-25468/25469 are memory leaks fixed on FFmpeg master (commit d5873b) in early 2025; the 9.0.2 release includes the fix, permanently N/A. CVE-2026-107675/107676/107677/107678/107696 (SFTP host-key check, uninitialised metadata bytes, DASH and RTSP infinite loops, stack exhaustion on a crafted MP4) are described by NVD as affecting releases through 9.0.2, though its CPE range stops before 9.0.2, so whether 9.0.2 is really affected is unclear; there is no later release and nixos-unstable ships 9.0.2. CVE-2026-107660, which the 9.0.1 entry covered, is fixed in 9.0.2. CVE-2026-125064 (added 2026-11-22) is a NULL pointer dereference in the G.726 decoder (libavcodec/g726.c ignores an init_get_bits() failure) on a crafted AVI with an oversized G.726 audio chunk: a crash only. NVD lists it as affecting releases through 9.0.2, the fix (commit ec887b1) is on master only, and nixpkgs carries no patch for it. All real or presumed real, and accepted as low risk: each needs ffmpeg to process hostile media or connect to a hostile server, and ffmpeg is only in the closure as a library dependency of desktop apps; no scripts or services here feed it untrusted URLs. Renewed on 2026-11-22 for two weeks, because nixos-unstable still ships 9.0.2 and the highest CVSS is 8.8. Re-check for an ffmpeg bump in nixpkgs before this expires.",
  "Mitigation: until nixpkgs ships a fixed ffmpeg, do not play, transcode or thumbnail media from untrusted sources with ffmpeg or apps built on it (especially RTSP, DASH or sftp URLs, and MP4 or MKV files from unknown senders). Stick to media you trust.",
]

["rsync-3.5.0"]
cve = "CVE-2026-119741"
until = "2026-12-06"
comment = [
  "Real and unpatched: in the delta-transfer sender, hash_search() does unbounded strong-checksum work when a malicious receiver sends weak checksums that collide at consecutive offsets, exhausting CPU (denial of service only, CVSS 7.5). NVD gives the fix as 3.5.2, though its CPE range stops at 3.5.1; nixpkgs ships 3.5.0 on nixos-unstable and master with no patches. It is the sender that is affected, and the realistic target is a public rsync daemon module. We run no rsync daemon and only use rsync as a client over ssh. Accepted as low risk; renewed on 2026-11-22 for two weeks because nixpkgs is still on 3.5.0. Re-check for an rsync bump in nixpkgs before this expires.",
  "Mitigation: until a fixed rsync lands, do not run rsyncd or serve a module to the network, and do not let untrusted hosts pull from this machine with rsync.",
]

["sqlite-3.54.0"]
cve = "CVE-2026-119586"
until = "2026-11-27"
comment = [
  "Real and unpatched: the sqlite3 shell's .recover command prints attacker-planted dot-commands from a database's schema verbatim, so a crafted database can run shell commands when the output of .recover is piped back into sqlite3 (CVSS 7.8, local, needs a user to run it). NVD says it affects SQLite through 3.54.1, the newest release, so no fixed version exists, and nixpkgs ships 3.54.0 on nixos-unstable and master. The other ten CVEs accepted under sqlite-3.53.3 are fixed in 3.54.0. Library use isn't affected, the sqlite3 shell isn't in the system profile (user profiles weren't checked), and we do not open untrusted databases. Accepted as low risk. Re-check for a release after 3.54.1 before this expires.",
  "Mitigation: never run .recover on a database you did not create, and never pipe its output into sqlite3 or a shell.",
]

["libmicrohttpd-1.0.6"]
cve = [ "CVE-2025-59777", "CVE-2025-62689" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "Fixed in commit ff13abc after v1.0.2; we run 1.0.6."

["libmicrohttpd-1.0.10"]
cve = [ "CVE-2025-59777", "CVE-2025-62689" ]
issue_url = "https://github.com/huwd/declarative_laptop/pull/60"
comment = "Same as libmicrohttpd-1.0.6 — fixed in commit ff13abc after v1.0.2; we run 1.0.10."

["jq-1.8.2"]
cve = [ "CVE-2026-33948", "CVE-2026-39979", "CVE-2026-44777" ]
issue_url = "https://github.com/huwd/declarative_laptop/issues/17"
comment = "Fix commits 6374ae0 and 2f09060 are ancestors of the jq-1.8.2 tag (checked via GitHub compare); CVE-2026-44777 affects 1.8.2rc1 and earlier."


